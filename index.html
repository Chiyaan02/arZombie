<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AR Zombie Shooter - 180° Floor Detect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Noto+Sans+Tamil:wght@500;700;800&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
      font-family: 'Noto Sans Tamil', system-ui, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    
    #video-feed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: none;
      z-index: 1;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: auto;
    }

    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .hud-title {
      font-family: 'Teko', 'Noto Sans Tamil', sans-serif;
    }

    /* Red flash animation when hit */
    #damage-flash {
      position: absolute;
      inset: 0;
      background: rgba(225, 29, 72, 0.45);
      opacity: 0;
      transition: opacity 0.2s ease-out;
      pointer-events: none;
    }

    /* Crosshair */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .crosshair::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      background: #ef4444;
      border-radius: 50%;
    }

    /* Pulsing floor detection target */
    .pulse-ring {
      animation: ringPulse 1.8s infinite ease-in-out;
    }
    @keyframes ringPulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
  </style>
</head>
<body class="bg-black text-white select-none">

  <!-- Real Camera Feed for Non-WebXR / Fallback Mode -->
  <video id="video-feed" playsinline muted autoplay></video>

  <!-- Damage Overlay -->
  <div id="damage-flash"></div>

  <!-- UI Overlay Layer -->
  <div class="ui-layer flex flex-col justify-between p-4">

    <!-- Top HUD (Score, Health, Level) -->
    <div id="game-hud" class="hidden flex justify-between items-center bg-black/60 backdrop-blur-md rounded-2xl p-4 border border-white/10 shadow-lg">
      <div class="flex flex-col">
        <span id="hud-level" class="hud-title text-2xl font-bold text-amber-400 tracking-wider">நிலை: 1</span>
        <span id="hud-kills" class="text-xs font-semibold text-gray-300">கொல்லப்பட்டவை: 0 / 8</span>
      </div>
      
      <div class="w-1/2 max-w-[200px]">
        <div class="flex justify-between text-xs mb-1 font-bold">
          <span>ஆரோக்கியம்</span>
          <span id="hp-text">100%</span>
        </div>
        <div class="w-full h-3 bg-gray-800 rounded-full overflow-hidden border border-gray-700">
          <div id="hp-bar" class="h-full bg-emerald-500 transition-all duration-300 w-full"></div>
        </div>
      </div>
    </div>

    <!-- 180 Sector Directional Arc Indicator (Minimap style) -->
    <div id="arc-indicator" class="hidden absolute top-20 right-4 bg-black/60 backdrop-blur-md p-3 rounded-2xl border border-white/10 flex flex-col items-center">
      <div class="text-[10px] text-amber-400 font-bold mb-1">180° தாக்குதல் மண்டலம்</div>
      <svg class="w-16 h-10" viewBox="0 0 100 50">
        <!-- 180 Degree Arc representation -->
        <path d="M 10 50 A 40 40 0 0 1 90 50 Z" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2"/>
        <!-- Player Center Pointer -->
        <circle cx="50" cy="50" r="4" fill="#3b82f6"/>
        <line x1="50" y1="50" x2="50" y2="15" stroke="#3b82f6" stroke-width="2"/>
      </svg>
    </div>

    <!-- Aiming Reticle / Crosshair -->
    <div id="aim-crosshair" class="crosshair hidden"></div>

    <!-- Floor Surface Setup / Dynamic Hint Messages -->
    <div id="hint-box" class="hidden self-center bg-black/75 backdrop-blur-md text-amber-300 px-5 py-2.5 rounded-full border border-amber-500/40 text-center font-bold text-sm shadow-xl animate-bounce">
      தரையைக் கண்டறிய ஃபோனை முன்புறமாக நகர்த்தவும்...
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-center items-end gap-4 pb-4">
      <!-- Ground Lock Button -->
      <button id="btn-lock-floor" class="hidden pointer-events-auto bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-base px-8 py-4 rounded-full shadow-2xl border-2 border-emerald-300 active:scale-95 transition-all">
        📍 தரையை உறுதிசெய் (START)
      </button>

      <!-- Fire Button -->
      <button id="btn-fire" class="hidden pointer-events-auto w-24 h-24 rounded-full bg-gradient-to-br from-red-600 to-rose-700 text-white font-black text-xl shadow-2xl border-4 border-rose-300 active:scale-90 transition-transform flex items-center justify-center tracking-wider">
        சுடு!
      </button>
    </div>
  </div>

  <!-- Main Menu / Overlay Dialog -->
  <div id="menu-overlay" class="fixed inset-0 z-20 flex items-center justify-center bg-black/85 backdrop-blur-xl p-6 pointer-events-auto">
    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-3xl p-6 text-center shadow-2xl flex flex-col items-center">
      <div class="w-16 h-16 bg-red-950/80 rounded-2xl flex items-center justify-center border border-red-500/30 mb-4 shadow-inner">
        <span class="text-3xl">🧟</span>
      </div>
      <h1 id="menu-title" class="text-2xl font-black text-red-500 tracking-wide mb-2">AR சோம்பி ஷூட்டர்</h1>
      <p id="menu-desc" class="text-sm text-gray-300 leading-relaxed mb-6">
        உங்கள் நிஜமான தரையைக் கண்டறிந்து 180° கோணத்தில் வரும் சோம்பிக்களைச் சுட்டு வீழ்த்துங்கள்!
      </p>

      <button id="btn-start" class="hidden w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-extrabold text-lg py-4 rounded-2xl shadow-xl border border-red-400 active:scale-95 transition-all">
        ஆரம்பி (START AR)
      </button>
    </div>
  </div>

  <script>
    // --- APP STATE & VARIABLES ---
    const $ = id => document.getElementById(id);
    const isLowEnd = (navigator.hardwareConcurrency || 4) <= 4 || (navigator.deviceMemory || 4) <= 2;

    let scene, camera, renderer;
    let xrMode = false, xrSupported = false;
    let hitTestSource = null, hitTestSourceRequested = false;
    let currentFloorY = -1.4;
    let floorDetected = false;
    let basePosition = new THREE.Vector3();
    let initialFacingRotation = 0; // Store 180-deg reference frame

    let gameState = 'MENU'; // MENU, SCANNING, PLAYING, GAMEOVER
    let health = 100, kills = 0, level = 1, targetKills = 8;
    let spawnTimer = 0, lastTime = 0, gunRecoil = 0;
    let audioCtx = null;

    const zombies = [];
    const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 1.4);

    // Audio helper using Web Audio API
    function playSound(freq, duration, type = 'square', volume = 0.2) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // --- THREE.JS INITIALIZATION ---
    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.05, 100);

      renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: !isLowEnd,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(isLowEnd ? 1 : Math.min(window.devicePixelRatio, 2));
      renderer.localClippingEnabled = true;
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Lights
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(hemiLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(3, 6, 4);
      scene.add(dirLight);

      setupFloorReticle();
      setupGunMesh();

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }

    // --- FLOOR SURFACE DETECTION RETICLE ---
    let floorReticle, floorRingMesh;
    function setupFloorReticle() {
      floorReticle = new THREE.Group();

      // Outer ring
      const ringGeo = new THREE.RingGeometry(0.35, 0.42, 32).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide });
      floorRingMesh = new THREE.Mesh(ringGeo, ringMat);
      floorReticle.add(floorRingMesh);

      // Inner targeting dot
      const centerGeo = new THREE.CircleGeometry(0.08, 16).rotateX(-Math.PI / 2);
      const centerMat = new THREE.MeshBasicMaterial({ color: 0x34d399, side: THREE.DoubleSide });
      floorReticle.add(new THREE.Mesh(centerGeo, centerMat));

      // Pointer Pillar
      const pillarGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.8, 8);
      pillarGeo.translate(0, 0.4, 0);
      const pillarMat = new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.6 });
      floorReticle.add(new THREE.Mesh(pillarGeo, pillarMat));

      floorReticle.visible = false;
      scene.add(floorReticle);
    }

    // --- GUN MODEL MESH ---
    let gunGroup, muzzleFlash;
    function setupGunMesh() {
      gunGroup = new THREE.Group();
      const gunMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.7, roughness: 0.3 });
      const handleMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.8 });

      // Gun barrel & handle
      const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 0.38), gunMat);
      barrel.position.z = -0.1;
      const grip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.15, 0.07), handleMat);
      grip.position.set(0, -0.09, 0.06);
      grip.rotation.x = 0.3;

      // Muzzle Flash Effect
      muzzleFlash = new THREE.Mesh(
        new THREE.SphereGeometry(0.07, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xfacc15 })
      );
      muzzleFlash.position.z = -0.32;
      muzzleFlash.visible = false;

      gunGroup.add(barrel, grip, muzzleFlash);
      gunGroup.visible = false;
      scene.add(gunGroup);
    }

    // --- GYROSCOPE & CONTROLS FOR NON-XR ---
    let isGyro = false, yaw = 0, pitch = 0, dragStart = null;
    const qOffset = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
    const euler = new THREE.Euler(), qDevice = new THREE.Quaternion();

    window.addEventListener('deviceorientation', e => {
      if (xrMode || e.alpha == null) return;
      isGyro = true;
      const degToRad = Math.PI / 180;
      const orient = (screen.orientation ? screen.orientation.angle : 0) * degToRad;
      euler.set(e.beta * degToRad, e.alpha * degToRad, -e.gamma * degToRad, 'YXZ');
      camera.quaternion.setFromEuler(euler);
      camera.quaternion.multiply(qOffset);
      camera.quaternion.multiply(qDevice.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -orient));
    });

    // Fallback Mouse/Touch drag look
    window.addEventListener('pointerdown', e => {
      if (!xrMode && e.target.tagName === 'CANVAS') {
        dragStart = [e.clientX, e.clientY];
      }
    });
    window.addEventListener('pointerup', () => dragStart = null);
    window.addEventListener('pointermove', e => {
      if (xrMode || isGyro || !dragStart) return;
      yaw -= (e.clientX - dragStart[0]) * 0.004;
      pitch = Math.max(-1.1, Math.min(1.1, pitch - (e.clientY - dragStart[1]) * 0.004));
      dragStart = [e.clientX, e.clientY];
      camera.rotation.set(pitch, yaw, 0, 'YXZ');
    });

    // --- 180 DEGREE ARC ZOMBIE SPAWNING ---
    function spawnZombie() {
      const g = new THREE.Group();
      const zMat = c => new THREE.MeshStandardMaterial({ color: c, clippingPlanes: [floorPlane] });

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.25), zMat(0x1e3a8a));
      body.position.y = 1.05;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), zMat(0x4ade80));
      head.position.y = 1.65;

      const createLimb = (w, h, d, c, x, y) => {
        const grp = new THREE.Group();
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), zMat(c));
        m.position.y = -h / 2;
        grp.add(m);
        grp.position.set(x, y, 0);
        return grp;
      };

      const leftArm = createLimb(0.14, 0.65, 0.14, 0x4ade80, -0.34, 1.38);
      const rightArm = createLimb(0.14, 0.65, 0.14, 0x4ade80, 0.34, 1.38);
      leftArm.rotation.x = rightArm.rotation.x = -Math.PI / 2.1;

      const leftLeg = createLimb(0.18, 0.7, 0.18, 0x1e1b4b, -0.14, 0.7);
      const rightLeg = createLimb(0.18, 0.7, 0.18, 0x1e1b4b, 0.14, 0.7);

      g.add(body, head, leftArm, rightArm, leftLeg, rightLeg);

      // --- STRICT REQUIREMENT 1: 180-DEGREE ARC SPAWNING ONLY ---
      // Angle strictly between -90 deg (-PI/2) and +90 deg (+PI/2) relative to initial facing direction
      const arcAngle = initialFacingRotation + (Math.random() * Math.PI - Math.PI / 2);
      const distance = 4 + Math.random() * 4;

      const spawnX = basePosition.x + Math.sin(arcAngle) * distance;
      const spawnZ = basePosition.z - Math.cos(arcAngle) * distance; // Negative Z is forward

      g.position.set(spawnX, currentFloorY - 1.8, spawnZ); // Starts under confirmed floor!

      g.userData = {
        hp: 2 + Math.floor(level / 3),
        speed: 0.5 + level * 0.12 + Math.random() * 0.2,
        t: Math.random() * 5,
        leftArm, rightArm, leftLeg, rightLeg, head,
        attackTimer: 0, dead: 0, fallProgress: 0, riseProgress: 0
      };

      // Ground Mound Visual when spawning from earth
      const moundMat = new THREE.MeshBasicMaterial({ color: 0x3f2e18, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
      const mound = new THREE.Mesh(new THREE.CircleGeometry(0.65, 20).rotateX(-Math.PI / 2), moundMat);
      mound.position.set(spawnX, currentFloorY + 0.01, spawnZ);
      scene.add(mound);
      setTimeout(() => scene.remove(mound), 4500);

      scene.add(g);
      zombies.push(g);
    }

    // --- WEAPON FIRING & HIT DETECTION ---
    const raycaster = new THREE.Raycaster();
    const camPos = new THREE.Vector3(), camDir = new THREE.Vector3(), camQuat = new THREE.Quaternion();

    function fireWeapon() {
      if (gameState !== 'PLAYING') return;

      playSound(140, 0.12, 'sawtooth', 0.3);
      gunRecoil = 0.09;
      muzzleFlash.visible = true;
      setTimeout(() => muzzleFlash.visible = false, 45);

      camera.updateMatrixWorld(true);
      camera.getWorldPosition(camPos);
      camera.getWorldQuaternion(camQuat);
      camDir.set(0, 0, -1).applyQuaternion(camQuat);

      raycaster.set(camPos, camDir);
      raycaster.far = 40;

      const activeZombies = zombies.filter(z => !z.userData.dead && z.userData.riseProgress >= 0.8);
      const hits = raycaster.intersectObjects(activeZombies, true);

      if (hits.length > 0) {
        let hitObj = hits[0].object;
        while (hitObj.parent && !hitObj.userData.hp) hitObj = hitObj.parent;
        const targetZombie = hitObj.userData;

        // Headshot bonus damage
        const isHead = hits[0].object === targetZombie.head;
        targetZombie.hp -= isHead ? 2 : 1;

        // Visual flash feedback
        hitObj.traverse(child => {
          if (child.material && child.material.emissive) {
            child.material.emissive.setHex(0xef4444);
            setTimeout(() => child.material.emissive.setHex(0x000000), 90);
          }
        });

        playSound(isHead ? 420 : 280, 0.08, 'triangle', 0.25);

        if (targetZombie.hp <= 0) {
          targetZombie.dead = 0.001;
          kills++;
          updateHUD();
          playSound(90, 0.35, 'sawtooth', 0.3);

          if (kills >= targetKills) {
            levelUp();
          }
        }
      }
    }

    // Event Listeners for Shooting
    $('btn-fire').addEventListener('pointerdown', e => { e.preventDefault(); fireWeapon(); });
    window.addEventListener('keydown', e => { if (e.code === 'Space') fireWeapon(); });

    // --- GAME PROCESS & UI CONTROL ---
    function updateHUD() {
      $('hud-level').textContent = `நிலை: ${level}`;
      $('hud-kills').textContent = `கொல்லப்பட்டவை: ${kills} / ${targetKills}`;
      const hpPct = Math.max(0, health);
      $('hp-bar').style.width = hpPct + '%';
      $('hp-text').textContent = hpPct + '%';

      if (hpPct <= 30) {
        $('hp-bar').className = 'h-full bg-rose-600 transition-all duration-300 w-full';
      } else if (hpPct <= 60) {
        $('hp-bar').className = 'h-full bg-amber-500 transition-all duration-300 w-full';
      } else {
        $('hp-bar').className = 'h-full bg-emerald-500 transition-all duration-300 w-full';
      }
    }

    function clearZombies() {
      zombies.forEach(z => scene.remove(z));
      zombies.length = 0;
    }

    function showDialog(title, desc, btnText, callback) {
      $('menu-title').textContent = title;
      $('menu-desc').textContent = desc;
      const btn = $('btn-start');
      btn.textContent = btnText;
      btn.onclick = () => {
        $('menu-overlay').classList.add('hidden');
        callback();
      };
      $('menu-overlay').classList.remove('hidden');
    }

    function levelUp() {
      gameState = 'MENU';
      clearZombies();
      level++;
      kills = 0;
      targetKills = 6 + level * 3;
      health = Math.min(100, health + 35);
      updateHUD();
      showDialog('✅ நிலை முடிந்தது!', `அடுத்த கட்டம்: நிலை ${level}. தயாராக இருங்கள்!`, 'அடுத்த நிலை', () => {
        gameState = 'PLAYING';
      });
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      clearZombies();
      showDialog('💀 ஆட்டம் முடிந்தது', 'சோம்பிக்கள் உங்களைத் தாக்கிவிட்டன!', 'மீண்டும் விளையாடு', () => {
        level = 1;
        kills = 0;
        targetKills = 8;
        health = 100;
        updateHUD();
        gameState = 'PLAYING';
      });
    }

    // --- LOCK FLOOR & START GAMEPLAY ---
    function lockFloorAndStart() {
      camera.updateMatrixWorld(true);
      camera.getWorldPosition(camPos);
      camera.getWorldQuaternion(camQuat);

      // Determine Facing Angle (YAW) for 180-deg reference
      const eulerRot = new THREE.Euler().setFromQuaternion(camQuat, 'YXZ');
      initialFacingRotation = eulerRot.y;

      if (xrMode && floorReticle.visible) {
        currentFloorY = floorReticle.position.y;
        basePosition.set(floorReticle.position.x, currentFloorY, floorReticle.position.z);
      } else {
        currentFloorY = camPos.y - 1.4;
        camDir.set(0, 0, -1).applyQuaternion(camQuat);
        camDir.y = 0;
        camDir.normalize();
        basePosition.set(camPos.x + camDir.x * 2.5, currentFloorY, camPos.z + camDir.z * 2.5);
      }

      floorPlane.constant = -currentFloorY; // Clip zombies below detected ground
      floorReticle.visible = false;
      floorDetected = true;

      // Enable HUD & Weapon UI
      $('btn-lock-floor').classList.add('hidden');
      $('hint-box').classList.add('hidden');
      $('game-hud').classList.remove('hidden');
      $('arc-indicator').classList.remove('hidden');
      $('aim-crosshair').classList.remove('hidden');
      $('btn-fire').classList.remove('hidden');

      gameState = 'PLAYING';
      updateHUD();
      spawnTimer = 1.5;
    }

    $('btn-lock-floor').addEventListener('click', lockFloorAndStart);

    // --- MAIN RENDER & ANIMATION LOOP ---
    function renderLoop(timestamp, xrFrame) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.05);
      lastTime = timestamp;

      camera.updateMatrixWorld(true);
      camera.getWorldPosition(camPos);
      camera.getWorldQuaternion(camQuat);

      // --- WebXR Surface / Hit Test Detection ---
      if (xrMode && gameState === 'SCANNING' && xrFrame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then(viewerSpace => {
            session.requestHitTestSource({ space: viewerSpace }).then(source => hitTestSource = source);
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = xrFrame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const pose = hitTestResults[0].getPose(referenceSpace);
            floorReticle.position.set(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
            floorReticle.visible = true;
          }
        }
      } else if (!xrMode && gameState === 'SCANNING') {
        // Fallback ground visualization target in camera direction
        camDir.set(0, 0, -1).applyQuaternion(camQuat);
        camDir.y = 0;
        camDir.normalize();
        floorReticle.position.set(camPos.x + camDir.x * 2.5, camPos.y - 1.4, camPos.z + camDir.z * 2.5);
        floorReticle.visible = true;
      }

      // Gun recoil animation
      gunRecoil += (0 - gunRecoil) * Math.min(1, dt * 14);
      if (gameState === 'PLAYING') {
        gunGroup.visible = true;
        gunGroup.position.set(0.18, -0.16, -0.38 + gunRecoil).applyMatrix4(camera.matrixWorld);
        gunGroup.quaternion.copy(camQuat);

        // Spawn Management
        spawnTimer -= dt;
        const activeCount = zombies.filter(z => !z.userData.dead).length;
        if (spawnTimer <= 0 && activeCount < Math.min(isLowEnd ? 5 : 8, 3 + level)) {
          spawnZombie();
          spawnTimer = Math.max(0.8, 3.2 - level * 0.25);
        }
      } else {
        gunGroup.visible = false;
      }

      // Zombie AI Update & Animation
      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        const u = z.userData;
        u.t += dt * 4;

        // Death animation (fall over & disappear)
        if (u.dead) {
          u.dead += dt;
          const fallRate = Math.min(dt * 4, Math.PI / 2 - u.fallProgress);
          u.fallProgress += fallRate;
          z.rotateX(-fallRate);
          if (u.dead > 1.4) {
            scene.remove(z);
            zombies.splice(i, 1);
          }
          continue;
        }

        if (gameState !== 'PLAYING') continue;

        // Rising from the detected ground
        if (u.riseProgress < 1) {
          u.riseProgress = Math.min(1, u.riseProgress + dt / 1.5);
          z.position.y = currentFloorY - 1.8 * (1 - u.riseProgress);
          continue;
        }

        // Movement & Attack towards Player
        const dx = camPos.x - z.position.x;
        const dz = camPos.z - z.position.z;
        const dist = Math.hypot(dx, dz);

        z.lookAt(camPos.x, z.position.y, camPos.z);

        if (dist > 1.1) {
          // Walk Forward
          z.position.x += (dx / dist) * u.speed * dt;
          z.position.z += (dz / dist) * u.speed * dt;

          u.leftLeg.rotation.x = Math.sin(u.t) * 0.55;
          u.rightLeg.rotation.x = -Math.sin(u.t) * 0.55;
          u.leftArm.rotation.x = -Math.PI / 2.1 + Math.sin(u.t) * 0.15;
          u.rightArm.rotation.x = -Math.PI / 2.1 - Math.sin(u.t) * 0.15;
          z.position.y = currentFloorY + Math.abs(Math.sin(u.t)) * 0.03;
          u.attackTimer = 0;
        } else {
          // Attack Player
          u.attackTimer += dt;
          const swing = Math.sin(u.attackTimer * 10);
          u.leftArm.rotation.x = -Math.PI / 2 + swing * 0.6;
          u.rightArm.rotation.x = -Math.PI / 2 - swing * 0.6;

          if (u.attackTimer >= 0.9) {
            u.attackTimer = 0;
            health -= 8 + level * 2;
            updateHUD();
            playSound(75, 0.2, 'sawtooth', 0.35);

            // Red damage flash
            $('damage-flash').style.opacity = '1';
            setTimeout(() => $('damage-flash').style.opacity = '0', 180);

            if (navigator.vibrate) navigator.vibrate(120);
            if (health <= 0) {
              gameOver();
              break;
            }
          }
        }
      }

      renderer.render(scene, camera);
    }

    // --- AR / CAMERA PERMISSION INITIALIZATION ---
    async function startFallbackCamera() {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          await DeviceOrientationEvent.requestPermission();
        }
      } catch (e) {}

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        const video = $('video-feed');
        video.srcObject = stream;
        video.style.display = 'block';
        await video.play();
      } catch (e) {
        document.body.style.background = 'linear-gradient(to bottom, #111827, #030712)';
      }

      startFloorScanning();
    }

    async function startWebXR() {
      try {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'local-floor']
        });
        renderer.xr.setReferenceSpaceType('local-floor');
        await renderer.xr.setSession(session);
        xrMode = true;
        startFloorScanning();
      } catch (e) {
        startFallbackCamera();
      }
    }

    function startFloorScanning() {
      gameState = 'SCANNING';
      $('btn-lock-floor').classList.remove('hidden');
      $('hint-box').classList.remove('hidden');
      $('hint-box').textContent = '📍 கேமராவைத் தரைக்கு நேராகக் காட்டி "தரையை உறுதிசெய்" என்பதை அழுத்தவும்';
    }

    // --- SETUP APP ENTRY POINT ---
    window.onload = async () => {
      initThree();

      try {
        if (navigator.xr) {
          xrSupported = await navigator.xr.isSessionSupported('immersive-ar');
        }
      } catch (e) {}

      const startBtn = $('btn-start');
      startBtn.classList.remove('hidden');

      if (xrSupported) {
        $('menu-desc').textContent = 'WebXR AR கிடைக்கிறது! உங்கள் நிஜத் தரையைக் கண்டறிந்து 180° தாக்குதலைத் தொடங்கவும்.';
        startBtn.textContent = 'ஆரம்பி (WebXR AR)';
        startBtn.onclick = startWebXR;
      } else {
        $('menu-desc').textContent = 'கேமரா + கைரோஸ்கோப் மூலம் தரையைக் கண்டறிந்து 180° கோணத்தில் சோம்பிக்களைச் சுட்டு வீழ்த்துங்கள்!';
        startBtn.textContent = 'ஆரம்பி (Camera AR)';
        startBtn.onclick = startFallbackCamera;
      }

      renderer.setAnimationLoop(renderLoop);
    };
  </script>
</body>
</html>
